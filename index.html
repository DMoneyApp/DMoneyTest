  :root {

  /* Theme presets */
  html[data-theme="white"] {

    --text:#1F1F1F; --muted:#666666; --faint:#888888;
    --gold:#C58A16; --rose:#D64545; --green:#2E8B57; --gray:#777777; --input-bg:#F7F7F7;
  }
  html[data-theme="black"] {
    --bg1:#111111; --bg2:#080808; --bg3:#000000;

    --text:#C9C9C9; --muted:#8F8F8F; --faint:#666666;

  }

    --card:#0A4745; --card-border:#176764; --card-hover:#0D5552;
    --text:#EAFBF4; --muted:#9CC9C0; --faint:#6FA39B;

  html[data-theme="gray"] .eyebrow { font-size:14px; font-weight:700; letter-spacing:1.1px; }

  html[data-theme="gray"] .summary-card .label { font-size:14px; }
  html[data-theme="gray"] .summary-card .value { font-size:22px; }

  html[data-theme="gray"] .setting-card, html[data-theme="gray"] .card { border-radius:16px; }
  html[data-theme="gray"] .section-title { font-size:19px; }
  html[data-theme="gray"] .muted, html[data-theme="gray"] .empty-note { font-size:14px; }
  html[data-theme="gray"] .analysis-title { font-size:24px; }
  html[data-theme="gray"] .analysis-cat-name, html[data-theme="gray"] .analysis-cat-amount { font-size:16px; }
  html[data-theme="gray"] .easy-read-cat-icon { width:54px; height:54px; flex:0 0 54px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:rgba(240,211,107,.12); border:1px solid rgba(240,211,107,.38); font-size:28px; }

  html[data-theme="burgundy"] .icon-ledger-transfer, html[data-theme="signature"] .icon-ledger-transfer { color:var(--gold); font-size:26px; width:46px; flex:0 0 46px; text-align:center; }
  html[data-theme="gray"] .tx-item.easy-read-income { border:2px solid var(--green) !important; box-shadow:none !important; }
  html[data-theme="gray"] .tx-item.easy-read-expense { border:2px solid var(--rose) !important; box-shadow:none !important; }
  html[data-theme="gray"] .tx-item.easy-read-transfer { border:2px solid var(--gold) !important; box-shadow:none !important; }
  html[data-theme="gray"] .easy-read-tx-main { flex:1 1 auto; min-width:0; padding-right:4px; overflow:hidden; }
  html[data-theme="gray"] .easy-read-tx-main .tx-note { display:block; width:100%; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  html[data-theme="gray"] .easy-read-tx-main .tx-date { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  html[data-theme="gray"] .easy-read-meta-row { display:flex !important; align-items:center; flex-wrap:nowrap !important; gap:5px !important; margin-top:4px !important; min-width:0; overflow:hidden; }
  html[data-theme="gray"] .easy-read-meta-row .account-chip, html[data-theme="gray"] .easy-read-meta-row .category { max-width:none; }
  html[data-theme="gray"] .easy-read-meta-row .tx-chip { flex:0 1 auto; min-width:0; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  html[data-theme="gray"] .easy-read-tx-right { overflow:visible; width:88px; flex:0 0 88px; display:flex; align-items:center; justify-content:flex-end; min-width:88px; }
  html[data-theme="gray"] .easy-read-amount { display:grid; grid-template-columns:16px minmax(0,1fr); align-items:center; justify-content:end; width:100%; font-size:18px; font-weight:800; text-align:right; line-height:1.05; }
  html[data-theme="gray"] .easy-read-sign { text-align:center; font-weight:900; }
  html[data-theme="gray"] .easy-read-value { white-space:nowrap; overflow:visible; text-overflow:clip; font-variant-numeric:tabular-nums; }
  html[data-theme="gray"] .easy-read-amount-input { width:100%; min-width:0; border:0; padding:0; margin:0; background:transparent; color:inherit; font:inherit; font-weight:800; text-align:right; outline:none; }
  html[data-theme="gray"] .easy-read-amount-input::placeholder { color:currentColor; opacity:.65; }
  html[data-theme="gray"] .dmoney-edit-dialog textarea { background:var(--input-bg) !important; color:var(--text) !important; border-color:var(--card-border) !important; resize:vertical; min-height:58px; }
  .dmoney-edit-dialog textarea#txDescription { background:var(--input-bg) !important; color:var(--text) !important; border:1px solid var(--card-border) !important; border-radius:12px; padding:10px 12px; min-height:58px; height:58px; line-height:1.35; font:inherit; resize:vertical; outline:none; box-sizing:border-box; }
  .dmoney-edit-dialog textarea#txDescription:focus { border-color:var(--gold) !important; box-shadow:0 0 0 2px rgba(217,164,65,.14); }
  html[data-theme="gray"] .easy-read-actions { display:none !important; }
  html[data-theme="gray"] .tx-item.easy-read-income, html[data-theme="gray"] .tx-item.easy-read-expense, html[data-theme="gray"] .tx-item.easy-read-transfer { cursor:pointer; -webkit-tap-highlight-color:rgba(217,164,65,.12); }
  html[data-theme="gray"] .easy-read-actions .icon-btn { width:33px; height:33px; }
  @media(max-width:480px){ html[data-theme="gray"] .tx-item.easy-read-income, html[data-theme="gray"] .tx-item.easy-read-expense, html[data-theme="gray"] .tx-item.easy-read-transfer{height:96px;min-height:96px;} html[data-theme="gray"] .easy-read-tx-right{width:82px;flex-basis:82px;min-width:82px;} html[data-theme="gray"] .easy-read-cat-icon, html[data-theme="gray"] .easy-read-transfer-icon{width:46px;flex-basis:46px;} html[data-theme="gray"] .easy-read-cat-icon{height:46px;font-size:25px;} }

  html[data-theme="dimgray"] {
    /* Extra-dim, low-glare gray for comfortable night/long viewing. */
    --bg1:#B1B1B1; --bg2:#A6A6A6; --bg3:#9B9B9B;
    --card:#ADADAD; --card-border:#888888; --card-hover:#B7B7B7;
    --text:#171717; --muted:#353535; --faint:#505050;
    --gold:#765300; --rose:#B52F36; --green:#17663C; --gray:#505050; --input-bg:#A1A1A1;
  }
  html[data-theme="white"] .side-menu, html[data-theme="white"] .search-panel, html[data-theme="white"] .tx-modal { background:#FFFFFF; }
  html[data-theme="black"] .side-menu, html[data-theme="black"] .search-panel, html[data-theme="black"] .tx-modal { background:#0B0B0B; }
  html[data-theme="gray"] .side-menu, html[data-theme="gray"] .search-panel, html[data-theme="gray"] .tx-modal { background:#50514D; }
  html[data-theme="signature"] .side-menu, html[data-theme="signature"] .search-panel, html[data-theme="signature"] .tx-modal { background:#062F30; }
  html[data-theme="dimgray"] .side-menu, html[data-theme="dimgray"] .search-panel, html[data-theme="dimgray"] .tx-modal { background:#ADADAD; }
  html[data-theme="white"] .amount-display { background:#F3F3F3; }
  html[data-theme="black"] .amount-display { background:#050505; }
  html[data-theme="gray"] .amount-display { background:#444541; }
  html[data-theme="signature"] .amount-display { background:#052728; }
  html[data-theme="dimgray"] .amount-display { background:#9E9E9E; }
  html[data-theme="dimgray"] .btn-cancel { color:#202020 !important; background:#8D8D8D; }
  html[data-theme="dimgray"] label.check, html[data-theme="dimgray"] .tx-chip, html[data-theme="dimgray"] .help-section p, html[data-theme="dimgray"] .help-section ul { color:#252525 !important; }
  html[data-theme="dimgray"] .alert { color:#7D2028 !important; }
  html[data-theme="dimgray"] .theme-option-text small, html[data-theme="dimgray"] .empty-note, html[data-theme="dimgray"] .backup-section-title { color:#3F3F3F !important; }
  html[data-theme="dimgray"] button[style*="color:"] { color:var(--text) !important; }
  html[data-theme="dimgray"] button[style*="background:var(--gold)"] { color:#171717 !important; }
  html[data-theme="dimgray"] a { color:#123F72; }
  html[data-theme="white"] .help-section p, html[data-theme="white"] .help-section ul { color:#666; }
  html[data-theme="gray"] .help-section p, html[data-theme="gray"] .help-section ul { color:#606060; }
  html[data-theme="black"] .help-section p, html[data-theme="black"] .help-section ul { color:#8F8F8F; }
  html[data-theme="signature"] .help-section p, html[data-theme="signature"] .help-section ul { color:#9CC9C0; }
  html[data-theme="dimgray"] .help-section p, html[data-theme="dimgray"] .help-section ul { color:#555; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg3); position: relative; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse at top left, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 10px 16px 78px;
  }
  .display { font-family: Georgia, "Times New Roman", serif; }
  h1 { font-size: 27px; font-weight: 600; margin: 0; line-height: 1.15; }
  .eyebrow { display:flex; align-items:center; gap:7px; color: var(--gold); font-size: 12px; letter-spacing: 1px; margin-bottom: 6px; }
  .profile-bar { display:flex; gap:6px; margin-bottom:12px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
  .profile-bar::-webkit-scrollbar { display:none; }
  .profile-pill { flex-shrink:0; display:flex; align-items:center; gap:4px; padding:7px 12px; border-radius:20px; border:1px solid var(--card-border); background: var(--card); color: var(--muted); font-size:12px; font-weight:600; cursor:pointer; font-family: inherit; white-space:nowrap; }
  .profile-pill.active { background: var(--gold); color:#241318; border-color: var(--gold); }
  .profile-pill-cur { opacity:0.75; font-size:11px; }
  .profile-pill-add { background:transparent; border:1px dashed var(--card-border); color: var(--gold); }
  .tabs { display:flex; gap:4px; margin-bottom:18px; background: var(--input-bg); border-radius:12px; padding:4px; border:1px solid var(--card-border); }
  .tab-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:8px 2px; border-radius:9px; border:none; cursor:pointer; font-size:10.8px; font-weight:600; background:transparent; color: var(--muted); font-family: inherit; }
  .tab-btn.active { background: var(--gold); color:#241318; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .card { background: var(--card); border:1px solid var(--card-border); border-radius:14px; padding:14px; }
  .summary-card .label { font-size:11.5px; color: var(--muted); margin-bottom:4px; }
  .summary-card .value { font-size:18px; font-weight:900; font-family: inherit; letter-spacing:-.25px; font-variant-numeric:tabular-nums; }
  .summary-card.small .label { font-size: 10.5px; }
  .summary-card.small .value { font-size: 14px; }
  .section-title { font-family: Georgia, serif; font-size:18px; font-weight:600; margin: 18px 0 12px; }
  .cat-card { background: var(--card); border:1px solid var(--card-border); border-radius:16px; padding:14px; margin-bottom:10px; }
  .cat-row { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .cat-name { font-size:15px; font-weight:600; }
  .cat-sub { font-size:12.5px; color: var(--muted); margin-top:2px; }
  .cat-pct { font-size:13px; font-weight:700; }
  .icon-btns { display:flex; gap:4px; margin-top:4px; }
  .icon-btn { width:26px; height:26px; border-radius:8px; border:1px solid var(--card-border); background: var(--card-hover); color: var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:12px; }
  .icon-btn:disabled { background:#1D1013; color:#5A3F44; cursor:default; }
  .bar-bg { margin-top:10px; height:7px; background: var(--card-border); border-radius:4px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:4px; transition: width .3s; }
  input, select { background: var(--input-bg); border:1px solid var(--card-border); border-radius:10px; padding:9px 12px; color: var(--text); font-size:14px; outline:none; width:100%; box-sizing:border-box; font-family: inherit; }
  label.check { display:flex; align-items:center; gap:8px; font-size:12.5px; color:#D9BBA6; }
  .btn { display:flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:10px; padding:9px 14px; font-size:13.5px; font-weight:600; cursor:pointer; font-family: inherit; }
  .btn-gold { background: var(--gold); color:#241318; }
  .btn-cancel { background: var(--card-border); color:#E8C6CE; }
  .btn-green { background: var(--green); color:#132018; }
  .btn-outline { background:transparent; border:1px dashed var(--card-border); color: var(--gold); width:100%; }
  .form-box { background: var(--card); border:1px dashed var(--card-border); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .row-gap { display:flex; gap:8px; }
  .alert { background: rgba(196,82,108,0.12); border:1px solid rgba(196,82,108,0.35); border-radius:14px; padding:12px 14px; font-size:13px; color:#E8C6CE; margin-bottom:18px; line-height:1.5; }
  .tx-item { display:flex; align-items:center; justify-content:space-between; background: var(--card); border:1px solid var(--card-border); border-radius:12px; padding:9px 12px; margin-bottom:6px; }
  .tx-left { display:flex; align-items:center; gap:8px; min-width:0; }
  .tx-note { font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px; }
  .tx-date { font-size:11px; color: var(--faint); }
  .tx-amt { font-size:13.5px; font-weight:600; }
  /* Fixed DMoney transaction-value colors: these do not change with theme. */
  :root { --dmoney-income:#39C978; --dmoney-expense:#E05262; --dmoney-transfer:#D9A441; }
  .dmoney-income-value, .income-text { color:var(--dmoney-income) !important; }
  .dmoney-expense-value, .expense-text { color:var(--dmoney-expense) !important; }
  .dmoney-transfer-value, .transfer-text { color:var(--dmoney-transfer) !important; }
  .empty-note { font-size:13px; color: var(--faint); text-align:center; padding:20px; }
  .acct-card { background: var(--card); border:1px solid var(--card-border); border-radius:14px; padding:14px; margin-bottom:10px; }
  .acct-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .acct-info { display:flex; align-items:center; gap:10px; }
  .acct-icon { width:34px; height:34px; border-radius:10px; background: var(--card-border); display:flex; align-items:center; justify-content:center; font-size:16px; }
  .acct-name { font-size:14.5px; font-weight:600; }
  .acct-sub { font-size:11.5px; color: var(--faint); }
  .acct-bal-row { margin-top:10px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .acct-bal { font-size:19px; font-weight:700; font-family: Georgia, serif; }
  .acct-bal-row .privacy-eye { float:none; flex:0 0 auto; padding:0 4px; font-size:14px; }
  .month-card { background: var(--card); border:1px solid var(--card-border); border-radius:14px; padding:14px; margin-bottom:8px; }
  .month-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .month-name { font-size:14.5px; font-weight:600; }
  .month-net { font-size:13px; font-weight:700; }
  .month-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:12.5px; color: var(--muted); }
  .footnote { margin-top:22px; font-size:12px; color: var(--faint); text-align:center; line-height:1.6; }
  ::placeholder { color:#6B4E44; }
  .goal-card { background: var(--card); border:1px solid var(--card-border); border-radius:16px; padding:14px; margin-bottom:10px; cursor:pointer; }
  .goal-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .goal-name { font-size:16px; font-weight:700; font-family: Georgia, serif; }
  .goal-sub { font-size:12.5px; color: var(--muted); margin-top:2px; }
  .status-badge { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px; cursor:pointer; white-space:nowrap; border:none; font-family: inherit; }
  .status-not_started { background: rgba(107,90,82,0.25); color: var(--gray); }
  .status-in_progress { background: rgba(217,164,65,0.18); color: var(--gold); }
  .status-achieved { background: rgba(127,165,130,0.18); color: var(--green); }
  .status-active { background: rgba(127,165,130,0.14); color: var(--green); }
  .status-paused { background: rgba(217,164,65,0.18); color: var(--gold); }
  .status-completed { background: rgba(127,165,130,0.18); color: var(--green); }
  .status-toggle { display:flex; gap:5px; align-items:center; flex-wrap:wrap; }

  .back-btn { display:flex; align-items:center; gap:6px; background:none; border:none; color: var(--gold); font-size:13.5px; font-weight:600; cursor:pointer; padding:0; margin-bottom:14px; font-family: inherit; }
  .goal-header-row { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:16px; }
  .header-row { padding-right: 84px; margin-bottom:18px; }

    return dmoneyOpenBackupDB().then(function(db){return new Promise(function(resolve,reject){var tx=db.transaction('settings','readonly'),req=tx.objectStore('settings').get('fileHandle');req.onsuccess=function(){resolve(req.result||null);};req.onerror=function(){reject(req.error);};});});

  function dmoneyBackupPayload() {
    syncActiveProfileFromState();
    return JSON.stringify({app:'DMoney',version:'2.2',profiles:state.profiles,activeProfileId:state.activeProfileId,exportedAt:new Date().toISOString(),backupType:'automatic-file-backup'},null,2);
  }
  function dmoneyWriteAutoBackup() {
    if(!dmoneyAutoBackupHandle || !dmoneyAutoBackupReady) return Promise.resolve(false);
    return Promise.resolve(dmoneyAutoBackupHandle.queryPermission ? dmoneyAutoBackupHandle.queryPermission({mode:'readwrite'}) : 'granted').then(function(permission){
      if(permission!=='granted') { dmoneyAutoBackupStatus='Permission needed — open Backup and re-enable'; return false; }
      return dmoneyAutoBackupHandle.createWritable().then(function(writable){return writable.write(dmoneyBackupPayload()).then(function(){return writable.close();});}).then(function(){dmoneyAutoBackupStatus='Updated '+new Date().toLocaleString();return true;});
    }).catch(function(err){dmoneyAutoBackupStatus='Backup failed: '+(err&&err.message?err.message:'unknown error');console.warn('DMoney automatic file backup failed',err);return false;});
  }
  function scheduleAutoFileBackup() {
    if(!dmoneyAutoBackupReady || !dmoneyAutoBackupHandle) return;
    if(dmoneyAutoBackupTimer) clearTimeout(dmoneyAutoBackupTimer);
    dmoneyAutoBackupTimer=setTimeout(function(){dmoneyWriteAutoBackup().then(function(){if(state.tab==='backup')render();});},900);

  function initAutoFileBackup() {

      if(!handle)return;

      return (handle.queryPermission?handle.queryPermission({mode:'readwrite'}):Promise.resolve('prompt')).then(function(permission){
        if(permission==='granted'){dmoneyAutoBackupReady=true;dmoneyAutoBackupStatus='Connected — writing current backup';return dmoneyWriteAutoBackup().then(function(){if(state.tab==='backup')render();});}
        else {dmoneyAutoBackupReady=false;dmoneyAutoBackupStatus='Backup file remembered; permission required';if(state.tab==='backup')render();}

  function findGoal(id) { return state.goals.filter(function (g) { return g.id === id; })[0]; }

  // ---------- derived data ----------
  function accountBalances() {
    var map = {};
    state.accounts.forEach(function (a) { map[a.id] = a.opening; });
    state.transactions.forEach(function (t) {
      if (t.type === 'transfer') {
        if (map[t.fromAccountId] !== undefined) map[t.fromAccountId] -= t.amount;
        if (map[t.toAccountId] !== undefined) map[t.toAccountId] += t.amount;
        return;
      }
      if (map[t.accountId] === undefined) return;
      map[t.accountId] += t.type === 'income' ? t.amount : -t.amount;
    });
    return map;
  }
  function totalAccountBalance() {
    var bal = accountBalances();
    return state.accounts.filter(function (a) { return a.includeInTotal !== false; })
      .reduce(function (s, a) { return s + (bal[a.id] || 0); }, 0);
  }

  function availableForBudget() {
    var bal = accountBalances();
    return state.accounts.filter(function (a) { return a.includeInBudget; })
      .reduce(function (s, a) { return s + (bal[a.id] || 0); }, 0);
  }
  // Single running waterfall across ALL active goals (priority order), then active sub-categories.
  // Paused goals/categories do not consume current budget. Completed ones are treated as closed.
  function flattenAllocations() {
    var running = Math.max(0, availableForBudget());
    var result = [];
    var locked = [];
    var unlocked = [];

    // Historical savings are real funding and never come from the current cash balance.
    // Locks are reservations of existing/current savings; they never create additional money.
    state.goals.forEach(function (g) {
      var historical = Math.max(0, Number((g.planningMeta||{}).alreadySaved)||0);
      var goalLockedRemaining = lockedBudgetValue(g);
      (g.categories||[]).forEach(function (c) {
        var target = Math.max(0, Number(c.target)||0);
        var fromHistorical = Math.min(target, historical);
        historical -= fromHistorical;
        var remainingTarget = Math.max(0, target - fromHistorical);
        var catLocked = lockedCategoryValue(c);
        var lock = goalLockedRemaining > 0 ? Math.min(remainingTarget, goalLockedRemaining) : Math.min(remainingTarget, catLocked);
        if (goalLockedRemaining > 0) goalLockedRemaining -= lock;
        var row = {g:g,c:c,target:target,historical:fromHistorical,remainingTarget:remainingTarget,lock:Math.max(0,lock)};
        if (lock > 0) locked.push(row); else unlocked.push(row);
      });
    });

    // Locked savings are earmarked first. They consume the existing available balance.
    locked.forEach(function (row) {
      var g=row.g,c=row.c,goalStatus=normalizeGoalStatus(g.status),catStatus=normalizeSubGoalStatus(c.status,0);
      var fromLocked = (goalStatus==='active' && catStatus==='active') ? Math.min(row.remainingTarget, row.lock, running) : 0;
      running -= fromLocked;
      var filled=row.historical+fromLocked, pct=row.target>0?(filled/row.target)*100:0;
      result.push({goalId:g.id,id:c.id,name:c.name,target:row.target,filled:filled,historical:row.historical,fixed:fromLocked,current:fromLocked,pct:pct,remaining:Math.max(0,row.target-filled),goalStatus:goalStatus,status:catStatus,fixedBudget:lockedCategoryValue(c),lockedBudget:lockedCategoryValue(c),isLocked:true});
    });

    // Unlocked items receive whatever savings remain, in the existing priority order.
    unlocked.forEach(function (row) {
      var g=row.g,c=row.c,goalStatus=normalizeGoalStatus(g.status),catStatus=normalizeSubGoalStatus(c.status,0);
      var fromCurrent=(goalStatus==='active' && catStatus==='active')?Math.min(row.remainingTarget,Math.max(0,running)):0;
      running-=fromCurrent;
      var filled=row.historical+fromCurrent,pct=row.target>0?(filled/row.target)*100:0;
      result.push({goalId:g.id,id:c.id,name:c.name,target:row.target,filled:filled,historical:row.historical,fixed:0,current:fromCurrent,pct:pct,remaining:Math.max(0,row.target-filled),goalStatus:goalStatus,status:catStatus,fixedBudget:lockedCategoryValue(c),lockedBudget:lockedCategoryValue(c),isLocked:false});
    });

    // Restore original goal/category order for display and next-pending logic.
    result.sort(function(a,b){
      var ai=state.goals.findIndex(function(g){return g.id===a.goalId;}), bi=state.goals.findIndex(function(g){return g.id===b.goalId;});
      if(ai!==bi) return ai-bi;
      var ga=findGoal(a.goalId)||{}, ac=(ga.categories||[]).findIndex(function(c){return c.id===a.id;}), bc=(ga.categories||[]).findIndex(function(c){return c.id===b.id;});
      return ac-bc;
    });
    return {items:result,leftover:running};
  }
  function goalSummaries() {
    var flat = flattenAllocations();
    return state.goals.map(function (g) {
      var items = flat.items.filter(function (a) { return a.goalId === g.id; });
      var target = items.reduce(function (s, a) { return s + a.target; }, 0);
      var filled = items.reduce(function (s, a) { return s + a.filled; }, 0);
      var current = items.reduce(function (s, a) { return s + a.current; }, 0);
      var pct = target > 0 ? (filled / target) * 100 : 0;
      var nextPending = items.filter(function (a) { return a.pct < 100; })[0];
      return { goal: g, items: items, target: target, filled: filled, current: current, pct: pct, nextPending: nextPending };
    });
  }
  function filteredTx() {
    return state.transactions.filter(function (t) {
      var ids=(state.acctFilters&&state.acctFilters.length)?state.acctFilters:['all'];
      if (state.acctFilter !== 'all' && ids.indexOf('all')<0) {
        if (t.type === 'transfer') {
          if (ids.indexOf(t.fromAccountId)<0 && ids.indexOf(t.toAccountId)<0) return false;
        } else if (ids.indexOf(t.accountId)<0) return false;
      }
      if (state.period === 'day') return t.date === state.periodValue;
      if (state.period === 'month') return monthOf(t.date) === state.periodValue;
      if (state.period === 'year') return yearOf(t.date) === state.periodValue;
      return true;
    }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });

  function monthlyLedger() {
    var scoped = scopedCarryTransactions();
    var months = [];
    scoped.forEach(function (t) { var m = monthOf(t.date); if (months.indexOf(m) === -1) months.push(m); });
    months.sort();
    var ids=(state.acctFilters&&state.acctFilters.length)?state.acctFilters:['all'];
    var openingTotal=ids.indexOf('all')>=0?state.accounts.reduce(function(s,a){return s+a.opening;},0):state.accounts.filter(function(a){return ids.indexOf(a.id)>=0;}).reduce(function(s,a){return s+a.opening;},0);
    var carry=openingTotal;
    var rows=months.map(function(ym){
      var income=scoped.filter(function(t){return monthOf(t.date)===ym&&t.type==='income';}).reduce(function(s,t){return s+t.amount;},0);
      var expense=scoped.filter(function(t){return monthOf(t.date)===ym&&t.type==='expense';}).reduce(function(s,t){return s+t.amount;},0);
      var transferNet=0;
      if(ids.indexOf('all')<0){
        var transfersIn=scoped.filter(function(t){return monthOf(t.date)===ym&&t.type==='transfer'&&ids.indexOf(t.toAccountId)>=0;}).reduce(function(s,t){return s+t.amount;},0);
        var transfersOut=scoped.filter(function(t){return monthOf(t.date)===ym&&t.type==='transfer'&&ids.indexOf(t.fromAccountId)>=0;}).reduce(function(s,t){return s+t.amount;},0);
        transferNet=transfersIn-transfersOut;
      }
      var opening=carry; carry+=income-expense+transferNet;
      return {ym:ym,income:income,expense:expense,net:income-expense+transferNet,opening:opening,closing:carry};
    });
    return rows.reverse();
  }

  // ---------- in-app notifications ----------
  function unreadNotificationCount() {
    return (state.notifications || []).filter(function(n){ return !n.read; }).length;
  }
  function notificationDateLabel(ts) {
    try { return new Date(ts).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
    catch(e){ return ''; }
  }
  function commitmentDueDay(c) {
    var d = c && c.startDate ? new Date(c.startDate + 'T00:00:00') : null;
    return d && !isNaN(d.getTime()) ? d.getDate() : 1;
  }
  function commitmentPaidThisMonth(c, ym) {
    return commitmentPayments(c).some(function(t){ return monthOf(t.date) === ym; });
  }
  function addNotificationOnce(key, title, message, icon) {
    state.notifications = Array.isArray(state.notifications) ? state.notifications : [];
    if (state.notifications.some(function(n){ return n.key === key; })) return false;
    state.notifications.unshift({id:uid('notification'),key:key,title:title,message:message,icon:icon||'🔔',read:false,createdAt:new Date().toISOString()});
    if(state.notifications.length>200) state.notifications=state.notifications.slice(0,200);
    return true;
  }
  function refreshNotifications() {
    state.notifications = Array.isArray(state.notifications) ? state.notifications : [];
    var now = new Date(), ym = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'), day = now.getDate();
    var active = (state.commitments || []).filter(function(c){ return c && c.status !== 'completed' && Number(c.expectedMonthly)>0; });
    active.forEach(function(c){
      var due = commitmentDueDay(c);
      // On the first day of each month, create one monthly EMI reminder.
      if(day === 1){
        addNotificationOnce('emi-monthly-'+c.id+'-'+ym,'Monthly EMI Reminder',c.name+' has a planned payment of '+fmt(c.expectedMonthly)+' this month.','💳');
      }
      // If the due day has arrived (or passed) and this month's payment is not logged yet, remind once.
      if(day >= due && !commitmentPaidThisMonth(c,ym)){
        addNotificationOnce('emi-due-'+c.id+'-'+ym,'EMI Payment Due',c.name+' payment of '+fmt(c.expectedMonthly)+' is due. Record it in Log → Expense when paid.','📅');
      }
    });
    return unreadNotificationCount();
  }
  function renderNotificationBadge() {
    var n=unreadNotificationCount();
    return n ? '<span class="notification-badge">'+n+'</span>' : '';
  }
  function renderNotificationMenuMeta() {
    var total=(state.notifications||[]).length, n=unreadNotificationCount();
    return total ? '<span class="notification-menu-meta">'+total+(total===1?' notification':' notifications')+(n?' · '+n+' new':'')+'</span>' : '';
  }

  function renderSearchResults(){

  function renderHelp(){
    return '<div class="help-section"><h3>🌟 Why DMoney?</h3><p>DMoney is designed to keep your <b>money, accounts, goals and daily spending in one simple offline-first app</b>. Instead of using separate apps for transactions, budgeting, savings goals and account balances, you can manage them together. Your data stays in the browser on your device unless you choose to export a backup.</p></div>'+
    '<div class="help-section"><h3>❓ What can I do with DMoney?</h3><ul><li>Record <b>Income, Expenses and Transfers</b>.</li><li>Track money across multiple <b>Bank, Cash, Fixed Deposit and other accounts</b>.</li><li>Create <b>Goals and budgets</b> and prioritise where your available money should go.</li><li>Track planned items such as <b>EMIs, savings targets and SIP/investment contributions</b> using goals and transactions.</li><li>Review <b>Yearly Carry-Forward</b> to understand how money moves from one period to the next.</li><li>Search your transaction history and analyse income and expenses by period, account and category.</li><li>Use <b>Privacy</b> to hide financial values on screen.</li><li>Use separate <b>Profiles</b> for different people, purposes or currencies.</li><li>Change the app <b>Theme</b> and manage transaction categories in Settings.</li><li>Back up and restore your complete data and export information to CSV.</li></ul></div>'+
    '<div class="help-section"><h3>🧭 1. Start here — understand the main tabs and Beta Testing</h3><ul><li><b>Log:</b> your daily money diary. Add and review Income, Expense and Transfer transactions.</li><li><b>Analysis:</b> visual income and expense analysis by category and time period.</li><li><b>Goals:</b> your financial goals, budgeting and EMI/commitment tracking area.</li><li><b>Beta Testing:</b> the future-planning workspace for DMoney tools such as projections, affordability checks, what-if analysis, money calendar, net worth and financial health.</li><li><b>Accounts:</b> your actual money containers. Add bank accounts, cash, fixed deposits or other accounts and control how each account is counted.</li><li><b>Backup:</b> download/restore your data and export CSV files. Profile management is available from ☰ → Profile. <b>Beta Testing</b> is available from ☰ → Beta Testing.</li></ul></div>'+
    '<div class="help-section"><h3>💰 2. How to record Income</h3><ol><li>Open <b>Log</b>.</li><li>Tap the floating <b>+</b> button.</li><li>Select <b>Income</b>.</li><li>Enter the amount using the calculator keypad, or type a calculation and use the result.</li><li>Select the account receiving the money.</li><li>Select a category such as <b>Salary</b> if applicable.</li><li>Set Date and Time, add a Note if useful, then save.</li></ol><p>Income increases the selected account balance and is included in income analysis. Income values are shown in <b>green</b>.</p></div>'+
    '<div class="help-section"><h3>🔴 3. How to record an Expense</h3><ol><li>Open <b>Log</b> and tap <b>+</b>.</li><li>Select <b>Expense</b>.</li><li>Enter the amount.</li><li>Select the account from which you paid.</li><li>Select a category such as Food, Shopping, Recharge, Flight, Travelling, Bills, Health or Investment.</li><li>Set Date/Time and add a Note if needed.</li><li>Save the transaction.</li></ol><p>Expense reduces the selected account balance. Expense values are shown in <b>red</b> throughout the app, regardless of the selected theme.</p></div>'+
    '<div class="help-section"><h3>⇄ 4. How to record a Transfer</h3><ol><li>Tap <b>+</b> in Log and select <b>Transfer</b>.</li><li>Choose the <b>From Account</b>.</li><li>Choose the <b>To Account</b>.</li><li>Enter the amount and save.</li></ol><p>A transfer only moves your own money between accounts. It is <b>not income or expense</b> and does not inflate your spending or income totals.</p></div>'+
    '<div class="help-section"><h3>📊 5. How to make a budget</h3><ol><li>Open <b>Goals</b>.</li><li>Create a goal for a major target or planned spending area.</li><li>Open the goal and add budget items with their target amounts.</li><li>Put goals in the order you want money to be allocated.</li><li>DMoney funds goals <b>top to bottom</b> using money from accounts included in the budget.</li></ol><p><b>Example:</b> Create goals for EMI, rent, emergency savings, travel or another planned target. The goal waterfall shows how much is funded and what remains.</p></div>'+
    '<div class="help-section"><h3>🎯 6. Goals — how funding works</h3><ul><li>Goals are funded according to their displayed priority order.</li><li>Move a goal <b>up or down</b> when its priority changes.</li><li>Open a goal to add, edit, reorder or delete budget items.</li><li>Change the goal status when required.</li><li>Funding comes from accounts marked <b>Count this account toward the budget</b>.</li><li><b>Overall funded</b> shows progress across your planned goal amounts.</li></ul></div>'+
    '<div class="help-section"><h3>🏦 7. Accounts — track your actual money</h3><ol><li>Open <b>Accounts</b>.</li><li>Tap <b>+ Add an account</b>.</li><li>Choose the account type and enter its name and opening balance.</li><li>Choose whether it counts toward the budget and/or total balance.</li><li>Save. Future Income, Expense and Transfer entries update the account balance.</li></ol><p>The two account switches are independent, so an account can be included in both, one, or neither.</p></div>'+
    '<div class="help-section"><h3>🏠 8. How to track Assets</h3><p>Use <b>Accounts</b> to keep each major asset visible separately. When adding an account, choose a visual asset type such as <b>🪙 Gold, 🏠 Property / Real Estate, 🚗 Vehicle, 📈 Stocks, 📊 Mutual Fund or 🌱 SIP / Investment</b>.</p><ol><li>Open <b>Accounts → + Add an account</b>.</li><li>Give the asset a clear name, for example <b>Gold Jewellery, Flat, Car, HDFC Mutual Fund</b> or <b>Monthly SIP</b>.</li><li>Select the matching asset type so the account gets its own visual icon.</li><li>Enter the current/opening value you want DMoney to track.</li><li>Keep <b>Count this account toward total balance</b> enabled if you want the asset included in your overall balance.</li></ol><p><b>Gold:</b> create a Gold account for jewellery, coins or bars and enter the value you want to track. You can update the balance when your estimated value changes.</p><p><b>Property:</b> create a Property / Real Estate account such as “Apartment” or “Plot” and enter its tracked value. Update it manually when you want your recorded value to reflect a new estimate.</p><p><b>Stocks / Mutual Funds / SIP:</b> use the matching visual account type for the value you choose to track. DMoney does not fetch live prices, NAV, units or market returns automatically.</p><p><b>Important:</b> DMoney is a manual offline-first tracker. It does not independently verify market value, gold rates or property valuations.</p></div>'+
    '<div class="help-section"><h3>🧾 9. How to track EMI &amp; Commitments</h3><p>Use <b>Goals → EMI &amp; Commitments</b> for Flat, Car, Personal Loan and other long-term payment commitments.</p><ol><li>Add the commitment and enter its <b>Total Amount</b>, <b>Already Paid</b> amount and optional <b>Expected Monthly Payment</b>.</li><li>Whenever you actually pay, record it once in <b>Log → Expense</b>.</li><li>In the Expense entry, optionally choose <b>Link to EMI / Commitment</b>.</li><li>Multiple payments for the same commitment in one month are all counted.</li><li>Open the commitment to see payment history grouped month-wise, while those payments remain part of normal Expense history.</li><li>When the total is reached, mark the commitment <b>Completed</b>.</li></ol></div>'+
    '<div class="help-section"><h3>📈 10. How to track SIP / Investments</h3><p>There is no automatic SIP mandate or market-value calculator in the current version. For manual tracking:</p><ol><li>Record each SIP payment in <b>Log → Expense</b>.</li><li>Use the <b>Investment</b> category or create a custom category such as “SIP”.</li><li>Choose the account from which the SIP amount was paid.</li><li>For a planned monthly SIP, create a goal/budget target to reserve the amount you want to invest.</li></ol><p>This tracks the <b>cash leaving your account</b>. It does not fetch NAV, units, returns or live investment values.</p></div>'+
    '<div class="help-section"><h3>🏷️ 11. Categories — organise transactions</h3><ul><li>Built-in categories include Food, Salary, Shopping, Electronics, Recharge, Bills, Flight, Travelling, Transport, Rent, Health, Entertainment, Education, Gifts, Investment and Other.</li><li>While entering a transaction, use <b>+ Category</b> to create one immediately.</li><li>Or go to <b>☰ → Settings → Category Customization</b>.</li><li>Custom transaction categories are stored separately for each profile.</li><li>Use <b>Merge Categories</b> to combine similar categories and automatically update all matching historical transactions.</li></ul></div>'+
    '<div class="help-section"><h3>🔎 12. Search & transaction analysis</h3><ol><li>Tap the <b>search icon</b> in the header.</li><li>Search by note, category, account, date or transaction type.</li><li>Use Log filters for <b>All time, Day, Month or Year</b>.</li><li>Use the account filter to analyse one account or all accounts.</li></ol><p>Income is consistently <b>green</b>, Expense is consistently <b>red</b>, and Transfer is consistently <b>gold</b> in every theme.</p></div>'+
    '<div class="help-section"><h3>🔄 13. Carry-Forward — understand money over time</h3><ul><li><b>Yearly:</b> choose a year such as 2025 or 2026, or select <b>All years</b> for a combined view.</li><li>Each month shows opening/carried-in, income, expense, monthly saving/expense result and closing balance.</li><li>The yearly summary explains the flow from the <b>previous year → selected year → next year</b>.</li><li>You can change month order and show only active months for easier review.</li></ul></div>'+
    '<div class="help-section"><h3>👤 14. Profiles — keep finances separate</h3><ul><li>Use the profile pills at the top of <b>Log, Goals, Accounts or Backup</b> to switch immediately.</li><li>Each profile keeps its own goals, accounts, transactions, categories, currency and privacy settings.</li><li>Use <b>☰ → Profile</b> to create, rename, switch or remove profiles.</li><li><b>+ Profile</b> at the top opens profile management.</li></ul><p><b>Example:</b> Main, India and UAE can be kept as separate profiles instead of mixing their transactions.</p></div>'+
    '<div class="help-section"><h3>🔐 15. Privacy — hide financial values</h3><ul><li>Go to <b>Accounts → Privacy → Hide all</b> to mask important financial values across the app.</li><li>Each important value has its own privacy control, so you can reveal only what you need.</li><li>Account balances can also be hidden individually.</li><li>Use <b>Show all</b> from Accounts when you want to reveal everything again.</li></ul></div>'+
    '<div class="help-section"><h3>🎨 16. Themes & appearance</h3><ol><li>Tap ☰.</li><li>Open <b>Settings</b>.</li><li>Open <b>Theme</b>.</li><li>Choose <b>Burgundy & Gold, Clean White, Black & White, Easy Read or Dim Gray</b>.</li></ol><p>The theme is saved on the device. Financial meaning stays consistent in every theme: <b>Income = green</b> and <b>Expense = red</b>.</p></div>'+
    '<div class="help-section"><h3>💾 17. Backup & Restore</h3><ol><li>Open <b>Backup</b>.</li><li>Use <b>Download full backup (.json)</b> to save all profiles and their data.</li><li>Move the backup file to another device if required.</li><li>On the other device, open DMoney → Backup → <b>Restore from backup</b>.</li><li>CSV exports can be used for Accounts, Transactions and Goals/Budget Items in spreadsheet software.</li></ol><p>Backup is especially important before changing devices or clearing browser data.</p></div>'+
    '<div class="help-section"><h3>⚙️ 18. Settings</h3><ul><li><b>Theme:</b> change the complete visual appearance.</li><li><b>Transaction categories:</b> add or remove custom categories.</li><li>Profile management is under <b>☰ → Profile</b>.</li></ul></div>'+
    '<div class="help-section"><h3>📊 Analysis — what the controls mean</h3><ul><li><b>Expense Overview:</b> see spending by category, including the total and percentage share.</li><li><b>Income Overview:</b> see income by category.</li><li><b>Expense Flow / Income Flow:</b> review money movement across the selected period.</li><li><b>Account Analysis:</b> compare income and expenses by account.</li><li>Use the period selector and account selector to change the analysis scope.</li></ul></div>'+
    '<div class="help-section"><h3>🎯 Financial Goals — priority & completion</h3><ul><li>Goals can be arranged by priority so available money is allocated in that order.</li><li>Pause a goal when its priority temporarily changes; resume it later without deleting it.</li><li>Mark a goal or its sub-category <b>Completed</b> when it is finished.</li></ul></div>'+
    '<div class="help-section"><h3>🔐 Privacy — what the account controls mean</h3><ul><li><b>Hide all</b> masks financial values across the app.</li><li><b>Counts toward budget</b> means the account balance can be used when DMoney calculates available budget.</li><li><b>Counts toward total balance</b> means the account is included in the overall account balance total.</li><li>These settings do not delete or change the underlying transactions.</li></ul></div>'+
    '<div class="help-section"><h3>🏦 Account settings — budget & total balance</h3><ul><li>For each account, you can choose whether it contributes to the available budget and whether it contributes to the total balance.</li><li>Use these settings when an account should be tracked but should not be available for goal budgeting, or when it should be excluded from the overall balance calculation.</li></ul></div>'+
    '<div class="help-section"><h3>🔃 Profile Transfer</h3><ul><li>Open <b>☰ → Profile → Profile Transfer</b> to move money between two DMoney profiles.</li><li>Select the source profile/account and destination profile/account.</li><li>Enter the amount being sent and the <b>Exchange Rate</b> used for the conversion.</li><li>DMoney records an Expense in the source profile and the converted Income in the destination profile, linked by the same transfer ID.</li><li>Each profile keeps its own currency, so the sent and received amounts use their respective currencies.</li></ul></div><div class="help-section"><h3>❓ 19. Frequently asked questions</h3><ul><li><b>Why should I use DMoney?</b> To keep daily money tracking, account balances, goals and budgeting together in one simple app.</li><li><b>Does DMoney need internet?</b> No. It is designed to work offline in the browser.</li><li><b>Will changing theme delete my data?</b> No. Theme selection changes appearance only.</li><li><b>Can I use multiple currencies?</b> Yes. Each profile can have its own currency.</li><li><b>Can I have multiple bank/cash accounts?</b> Yes. Add as many accounts as needed.</li><li><b>Does Transfer count as spending?</b> No. It only moves money between your own accounts.</li><li><b>Can I edit a transaction?</b> Yes. Use the edit control on a logged transaction.</li><li><b>Can I hide amounts before showing someone my screen?</b> Yes. Use Accounts → Hide all.</li><li><b>Does DMoney automatically fetch bank balances, stock prices, SIP NAV or EMI schedules?</b> No. The current version is a manual, offline-first tracker.</li></ul></div>'+
    '<div class="help-section"><h3>💡 20. Recommended daily workflow</h3><ol><li>Keep your <b>Accounts</b> balances correct.</li><li>Record every <b>Income and Expense</b> in Log.</li><li>Use <b>Transfer</b> whenever money moves between your own accounts.</li><li>Review <b>Goals</b> to see whether planned targets are funded.</li><li>Check <b>Carry-Forward</b> regularly to understand your monthly/yearly money flow.</li><li>Use <b>Backup</b> regularly so your data is safe.</li></ol></div>';
  }

  function commitmentById(id){ return (state.commitments||[]).filter(function(c){return c.id===id;})[0]; }
  function commitmentPayments(c){ return state.transactions.filter(function(t){return t.type==='expense' && t.commitmentId===c.id;}).sort(function(a,b){var da=(a.date||'')+' '+(a.time||''), db=(b.date||'')+' '+(b.time||'');return da<db?1:-1;}); }
  function commitmentExternalPayments(c){
    var rows=Array.isArray(c.externalPayments)?c.externalPayments:[];
    return rows.map(function(x){return Object.assign({},x,{source:'external'});}).sort(function(a,b){var da=(a.date||'')+' '+(a.time||''), db=(b.date||'')+' '+(b.time||'');return da<db?1:-1;});
  }
  function commitmentStats(c){
    var historical=Number(c.alreadyPaid)||0, payments=commitmentPayments(c), external=commitmentExternalPayments(c), newPaid=payments.reduce(function(s,t){return s+(Number(t.amount)||0);},0), externalPaid=external.reduce(function(s,t){return s+(Number(t.amount)||0);},0), total=Number(c.totalAmount)||0;
    var paid=historical+newPaid+externalPaid, remaining=Math.max(0,total-paid), pct=total>0?Math.min(100,paid/total*100):0;
    return {historical:historical,newPaid:newPaid,externalPaid:externalPaid,paid:paid,total:total,remaining:remaining,pct:pct,payments:payments,externalPayments:external};
  }
  function commitmentMonthRows(c){
    var by={};
    commitmentPayments(c).forEach(function(t){var m=monthOf(t.date);(by[m]||(by[m]=[])).push(Object.assign({},t,{source:'account'}));});
    commitmentExternalPayments(c).forEach(function(t){var m=monthOf(t.date);(by[m]||(by[m]=[])).push(t);});
    return Object.keys(by).sort().reverse().map(function(m){var rows=by[m].slice().sort(function(a,b){var da=(a.date||'')+(a.time||''),db=(b.date||'')+(b.time||'');return da<db?1:-1;});return {ym:m,rows:rows,total:rows.reduce(function(s,t){return s+(Number(t.amount)||0);},0)};});
  }

    }
    var income=sum('income',false);

    var commitments=(state.commitments||[]).filter(function(c){return c.status!=='completed';}).reduce(function(a,c){return a+Number(c.expectedMonthly||0);},0);

  function calcLoan(principal,annualRate,months,payment){
    var r=(annualRate/100)/12, bal=Math.max(0,principal), interest=0, paid=0, count=0, rows=[];
    if(!bal||months<=0)return {payment:0,totalInterest:0,totalPaid:0,months:0,rows:[],endBalance:0};
    var pmt=payment;
    if(!pmt){pmt=r>0?bal*r*Math.pow(1+r,months)/(Math.pow(1+r,months)-1):bal/months;}
    if(pmt<=bal*r && r>0)return {payment:pmt,totalInterest:Infinity,totalPaid:Infinity,months:months,rows:[],endBalance:bal};
    while(bal>0.005 && count<1200){
      var interestMonth=bal*r; var principalMonth=Math.min(bal,Math.max(0,pmt-interestMonth));
      if(principalMonth<=0)break;
      bal=Math.max(0,bal-principalMonth); interest+=interestMonth; paid+=principalMonth+interestMonth; count++;
      rows.push({month:count,interest:interestMonth,principal:principalMonth,balance:bal});
      if(count>=months && payment===undefined)break;
      if(count>=months && payment!==undefined && bal>0.005)break;
    }
    return {payment:pmt,totalInterest:interest,totalPaid:paid,months:count,rows:rows,endBalance:bal};
  }

  function privacyKey(label) {
    var l = String(label || '').toLowerCase();
    if (l.indexOf('income') >= 0) return 'income';
    if (l.indexOf('expense') >= 0) return 'expense';
    if (l.indexOf('net') >= 0 || l.indexOf('saving') >= 0) return 'net';
    if (l.indexOf('budget') >= 0) return 'budget';
    if (l.indexOf('available') >= 0) return 'available';
    if (l.indexOf('funded') >= 0 || l.indexOf('% funded') >= 0) return 'funded';
    if (l.indexOf('target') >= 0) return 'target';
    if (l.indexOf('balance') >= 0 || l.indexOf('carried') >= 0 || l.indexOf('opening') >= 0 || l.indexOf('closing') >= 0 || l.indexOf('total') >= 0) return 'balance';
    if (l.indexOf('savings') >= 0) return 'net';
    return 'money';
  }

  // Actual money currently protected for goals. A goal-level lock takes precedence

  function lockedReservedTotal(){

      var goalLock=lockedBudgetValue(g);

      return total+(g.categories||[]).reduce(function(sum,c){ return sum+lockedCategoryValue(c); },0);
    },0);

  function lockedReservedForGoal(g){
    if(!g) return 0;

    return (g.categories||[]).reduce(function(sum,c){ return sum+lockedCategoryValue(c); },0);

  function monthlyGoalSavingsEstimate(){
    var now=new Date(),total=0;
    (state.goals||[]).forEach(function(g){
      var status=String(g.status||'active').toLowerCase();
      if(status==='completed'||status==='paused') return;

  function seedHistoricalCategoryLearning(){

    var defs=categoryDefinitions();
    var valid={}; defs.forEach(function(c){valid[c.name]=true;});
    var buckets={};
    (state.transactions||[]).forEach(function(t){

      var type=t.type==='income'?'income':'expense';
      state.categoryUsage[type]=state.categoryUsage[type]||{};

      var ts=Date.parse(String(t.date||'')+'T'+String(t.time||'00:00'));
      if(!isFinite(ts)) ts=0;

  function downloadFile(filename, content, mime) {

  function mergeSelectedCategories(){

    var types=checked.map(function(x){return x.getAttribute('data-type');}).filter(function(v,i,a){return a.indexOf(v)===i;});
    if(types.length!==1){alert('Please merge Expense categories separately from Income categories.');return;}
    var keepBase=(document.getElementById('dmoneyMergeKeep')||{}).value;
    var defs=categoryDefinitions(),selected=checked.map(function(x){return defs.filter(function(c){return c.base===x.value;})[0];}).filter(Boolean);
    var keep=selected.filter(function(c){return c.base===keepBase;})[0];
    if(!keep){alert('Choose the category you want to keep from the selected categories.');return;}
    var sources=selected.filter(function(c){return c.base!==keep.base;});
    if(!sources.length){alert('Choose at least one other category to merge into the category you keep.');return;}
    var sourceNames=sources.map(function(c){return c.name;}).join(', ');
    if(!confirm('Merge '+sourceNames+' into "'+keep.name+'"?\n\nAll existing transactions using these categories will be reassigned to "'+keep.name+'". The selected categories will no longer appear separately.'))return;
    sources.forEach(function(src){
      state.transactions.forEach(function(t){if(t.category===src.name||t.category===src.base)t.category=keep.name;});
      state.transactionCategories=state.transactionCategories.filter(function(c){return c!==src.base&&c!==src.name;});
      var prior=state.categoryOverrides[src.base]||{};
      state.categoryOverrides[src.base]=Object.assign({},prior,{removed:true,mergedInto:keep.base,mergedIntoName:keep.name});
    });
    save();closeCategoryMergeOverlay();render();
    alert('Categories merged successfully. All matching transactions now use "'+keep.name+'".');
  }

  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);
    });

    if(dateVal){
      var d=new Date(dateVal+'T00:00:00');
      if(!isNaN(d.getTime())){
        months=(d.getFullYear()-now.getFullYear())*12+(d.getMonth()-now.getMonth());
        if(d.getDate()>=now.getDate()) months += 0;
        else months -= 1;
        months=Math.max(0,months);
      }
    }
    var monthly=months>0 ? remaining/months : remaining;
    var pct=Math.min(100,target>0?(saved/target)*100:0);
    var status=remaining<=0?'Fully funded':(months>0?'Monthly saving required':'Target date needs attention');
    r.innerHTML=
      '<div class="beta-summary-grid">'+
        '<div><span>Event</span><b>'+esc(name)+'</b></div>'+
        '<div><span>Total Target</span><b>'+money(target)+'</b></div>'+
        '<div><span>Already Saved</span><b>'+money(saved)+'</b></div>'+
        '<div><span>Remaining</span><b>'+money(remaining)+'</b></div>'+
        '<div><span>Progress</span><b>'+pct.toFixed(1)+'%</b></div>'+
        '<div><span>Months Left</span><b>'+months+'</b></div>'+
      '</div>'+
      '<div class="beta-progress"><div style="width:'+pct+'%"></div></div>'+
      '<div class="beta-callout"><strong>'+status+'</strong>'+
      (remaining>0 ? '<br>Recommended monthly saving: <b>'+money(monthly)+'</b>' : '<br>You have already reached the target.')+
      '</div>'+
      '<div class="beta-mini">Target date: '+(dateVal||'Not set')+'</div>';
  };
})();
</script>


<script id="dmoney-v46-goal-unified">
(function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);
  });}
  function num(v){return Number(v)||0;}
  function money(v){
    try{return new Intl.NumberFormat(undefined,{maximumFractionDigits:0}).format(num(v));}
    catch(e){return Math.round(num(v)).toLocaleString();}
  }

  function currentProfileState(){
    try{
      if(typeof state!=='undefined' && state) return state;
    }catch(e){}
    return null;
  }

  window.dmoneyV46RenderGoalSubgoals=function(goal){
    if(!goal) return '';
    var subs=Array.isArray(goal.subGoals)?goal.subGoals:(Array.isArray(goal.subgoals)?goal.subgoals:[]);
    if(!subs.length) return '<div class="dmoney-v46-goal-subgoals"><div class="muted">No sub-goals added yet.</div></div>';

    return '<div class="dmoney-v46-goal-subgoals">'+
      '<h3>Budget & Sub-Goals</h3>'+
      '<div class="muted">Each item stays inside this goal. Progress is calculated separately for every sub-goal.</div>'+
      subs.map(function(s,i){
        var target=num(s.target!=null?s.target:s.amount);
        var funded=num(s.funded!=null?s.funded:s.saved);
        var pct=target>0?Math.min(100,funded/target*100):0;
        var status=(s.status==='achieved')?'Achieved':'Unachieved';
        var icon=s.icon||'🎯';
        var name=s.name||s.title||('Sub-goal '+(i+1));
        return '<div class="v46-subgoal">'+
          '<div class="v46-subgoal-head"><div><span>'+esc(icon)+'</span> <span class="v46-subgoal-name">'+esc(name)+'</span></div>'+
          '<span class="v46-subgoal-status">'+status+'</span></div>'+
          '<div class="v46-subgoal-meta">Target: '+money(target)+' &nbsp; • &nbsp; Funded: '+money(funded)+' &nbsp; • &nbsp; '+pct.toFixed(1)+'%</div>'+
          '<div class="v46-subgoal-bar"><div style="width:'+pct+'%"></div></div>'+
          '<div class="v46-subgoal-actions">'+
            (typeof setSubGoalStatus==='function'?
              '<button onclick="setSubGoalStatus('+JSON.stringify(goal.id)+','+JSON.stringify(s.id||s.key||i)+',\"achieved\")">✓ Achieved</button>'+
              '<button onclick="setSubGoalStatus('+JSON.stringify(goal.id)+','+JSON.stringify(s.id||s.key||i)+',\"unachieved\")">✕ Unachieved</button>':'')+
          '</div></div>';
      }).join('')+
      '</div>';
  };

  // Add a non-destructive Life Event connection explanation to the Beta planner.
  window.dmoneyV46LifeEventLink=function(){
    return '<div class="dmoney-v46-life-link"><b>🔗 Connected to Financial Goals</b><br>'+
      '<span class="muted">Life Event Planner is a planning tool—not a second goal system. Use it to build a budget, then create one Financial Goal with these items as its sub-goals. Your real payments remain in Log.</span></div>';
  };

  // Patch only once after the page has loaded. We preserve the original renderer.
  function patch(){
    if(window.__dmoneyV46Patched) return;
    if(typeof window.renderGoalDetail!=='function') return;
    var original=window.renderGoalDetail;
    window.renderGoalDetail=function(){
      var result=original.apply(this,arguments);
      try{
        var g=null;
        var a=arguments[0];
        if(a && typeof a==='object') g=a;
        else if(typeof state!=='undefined' && state && state.currentGoalId && Array.isArray(state.goals)){
          g=state.goals.find(function(x){return x.id===state.currentGoalId;});
        }
        // If original returns HTML, append sub-goals. If it renders directly,
        // the original function remains untouched; this compatibility block
        // is intentionally conservative.
        if(typeof result==='string' && g && !result.includes('dmoney-v46-goal-subgoals')){
          return result + window.dmoneyV46RenderGoalSubgoals(g);
        }
      }catch(e){}
      return result;
    };
    window.__dmoneyV46Patched=true;
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',patch);
  else patch();
})();
</script>

<script>
(function () {
  'use strict';
  if (typeof window.WBT === 'undefined') return;
  var WBT = window.WBT;
  var navStack = [];
  var poppingFromHistory = false;

  function pushNav(entry) {
    if (poppingFromHistory) return;
    history.pushState({ dmoneyNav: true }, '', location.href);
    navStack.push(entry);
  }

  function wrapToggle(name, isOpenFn) {
    var orig = WBT[name];
    if (typeof orig !== 'function') return;
    WBT[name] = function (v) {
      if (v) {
        orig.apply(WBT, arguments);
        pushNav({ fn: orig, arg: false, isOpen: isOpenFn });
      } else {
        if (navStack.length > 0 && !poppingFromHistory) {
          history.back();
        } else {
          orig.apply(WBT, arguments);
        }
      }
    };
  }

  function wrapPair(openName, closeName, isOpenFn) {
    var origOpen = WBT[openName];
    var origClose = WBT[closeName];
    if (typeof origOpen !== 'function' || typeof origClose !== 'function') return;
    WBT[openName] = function () {
      var r = origOpen.apply(WBT, arguments);
      pushNav({ fn: origClose, arg: undefined, isOpen: isOpenFn });
      return r;
    };
    WBT[closeName] = function () {
      if (navStack.length > 0 && !poppingFromHistory) {
        history.back();
      } else {
        origClose.apply(WBT, arguments);
      }
    };
  }

  window.addEventListener('popstate', function () {
    while (navStack.length > 0) {
      var top = navStack.pop();
      if (top.isOpen && !top.isOpen()) continue; // already closed some other way (e.g. Save) — skip silently
      poppingFromHistory = true;
      try { top.fn(top.arg); } finally { poppingFromHistory = false; }
      return;
    }
    // nothing of ours was open — let the back gesture behave normally (exit/minimize)
  });

  wrapToggle('toggleTxForm', function () { return !!document.querySelector('.tx-modal'); });
  wrapToggle('toggleMenu', function () { return !!document.querySelector('.side-menu'); });
  wrapToggle('toggleSearch', function () { return !!document.getElementById('dmoneySearchInput'); });
  wrapPair('openGoal', 'backToGoals', function () { return !!document.querySelector('.back-btn'); });
  wrapPair('openUtility', 'closeUtility', function () { return !!document.querySelector('.utility-panel, .notification-panel'); });
  wrapPair('startTransactionCategoryEdit', 'cancelTransactionCategoryEdit', function () { return !!document.getElementById('dmoneyEditOverlay'); });
  wrapPair('startAccountTypeEdit', 'cancelAccountTypeEdit', function () { return !!document.getElementById('dmoneyEditOverlay'); });
})();
</script>
